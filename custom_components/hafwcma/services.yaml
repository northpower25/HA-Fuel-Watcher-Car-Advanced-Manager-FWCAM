            - "commute"

get_all_trips:
  name: Get All Trips
  description: Retrieve all trips for a config entry. Returns trips sorted by end time (newest first).
  fields:
    config_entry_id:
      name: Config Entry ID
      description: The configuration entry ID of the integration instance
      required: true
      example: "abc123def456"
      selector:
        text:

get_all_refuelings:
  name: Get All Refuelings
  description: Retrieve all refueling events for a config entry. Returns events sorted by timestamp (newest first).
  fields:
    config_entry_id:
      name: Config Entry ID
      description: The configuration entry ID of the integration instance
      required: true
      example: "abc123def456"
      selector:
        text:

reverse_geocode:
  name: Reverse Geocode
  description: Convert latitude/longitude coordinates to location name and address. Uses cache by default to avoid repeated API calls.
  fields:
    latitude:
      name: Latitude
      description: Latitude coordinate
      required: true
      example: 50.0000
      selector:
        number:
          min: -90
          max: 90
          step: any
    longitude:
      name: Longitude
      description: Longitude coordinate
      required: true
      example: 10.0000
      selector:
        number:
          min: -180
          max: 180
          step: any
    use_cache:
      name: Use Cache
      description: Whether to use cached results (default true)
      required: false
      default: true
      example: true
      selector:
        boolean:

get_geocoding_cache_stats:
  name: Get Geocoding Cache Statistics
  description: Get statistics about the geocoding cache for debugging purposes. Shows total cache entries and their details (coordinates, names, addresses).

simulate_refueling_event:
  name: Simulate Refueling Event (Test)
  description: Create a simulated refueling event for testing Telegram notification functionality. This creates a fake refueling with missing data to trigger the bidirectional data collection flow.
  fields:
    config_entry_id:
      name: Config Entry ID
      description: The configuration entry ID of the integration instance
      required: true
      example: "abc123def456"
      selector:
        text:
    include_missing_data:
      name: Include Missing Data
      description: If true, creates a refueling with missing fields to test the data collection workflow
      required: false
      default: true
      example: true
      selector:
        boolean:

create_backup:
  name: Create Backup
  description: >
    Create a backup of all user data (refueling events, trips, odometer history,
    etc.) for a vehicle entry. The backup is saved as a JSON file in
    <config>/www/hafwcma_backups/ and can be downloaded via the HA web server
    at /local/hafwcma_backups/<filename>. The backup includes version metadata
    so that compatibility is checked automatically on restore.
  fields:
    config_entry_id:
      name: Config Entry ID
      description: The configuration entry ID of the integration instance
      required: true
      example: "abc123def456"
      selector:
        text:

list_backups:
  name: List Backups
  description: >
    List all haFWCMA backup files currently stored in the backup directory
    (<config>/www/hafwcma_backups/). Returns metadata for each file so the
    dashboard card can show available backups and offer one-click restore.


restore_backup:
  name: Restore Backup
  description: >
    Restore user data from a previously created backup file. The backup must
    have been created by haFWCMA. Compatibility is checked automatically:
    if breaking changes were introduced between the backup version and the
    current installation, the restore is blocked and an error is returned.
    Use 'force: true' to bypass soft compatibility warnings (hard errors always
    block the restore). After a successful restore, reload the integration or
    restart Home Assistant to apply the data.
  fields:
    config_entry_id:
      name: Config Entry ID
      description: The configuration entry ID of the integration instance
      required: true
      example: "abc123def456"
      selector:
        text:
    backup_file_path:
      name: Backup File Path
      description: >
        Absolute path to the backup JSON file on the Home Assistant server,
        e.g. /config/www/hafwcma_backups/hafwcma_backup_MyCar_20260101_120000.json
      required: true
      example: "/config/www/hafwcma_backups/hafwcma_backup_MyCar_20260101_120000.json"
      selector:
        text:
    force:
      name: Force Restore
      description: >
        If true, proceed with the restore even when soft compatibility warnings
        are present. Hard errors (e.g. newer data model version) always block
        the restore regardless of this flag.
      required: false
      default: false
      example: false
      selector:
        boolean:

delete_backup:
  name: Delete Backup
  description: >
    Delete a single backup file from the backup directory
    (<config>/www/hafwcma_backups/). Only files inside that directory that
    match the hafwcma_backup_*.json naming pattern can be deleted.
  fields:
    backup_file_path:
      name: Backup File Path
      description: >
        Absolute path to the backup JSON file to delete on the Home Assistant
        server, e.g. /config/www/hafwcma_backups/hafwcma_backup_MyCar_20260101_120000.json
      required: true
      example: "/config/www/hafwcma_backups/hafwcma_backup_MyCar_20260101_120000.json"
      selector:
        text:

export_debug_data:
  name: Export Anonymized Debug Data
  description: >
    Create an anonymized debug export of all integration data for this vehicle
    entry. GPS coordinates are shifted by a consistent random offset so that
    relative distances are preserved but absolute positions cannot be determined.
    Names, addresses and station information are replaced with stable pseudonyms.
    API keys and credentials are fully redacted. The file is saved to
    <config>/www/hafwcma_debug/ and can be downloaded via the Home Assistant web
    server at /local/hafwcma_debug/<filename>.

    ⚠️ Privacy disclaimer: This anonymization is a best-effort measure and does
    NOT guarantee complete anonymization or pseudonymization. You are responsible
    for reviewing the exported file before sharing it (e.g. in a bug report).
  fields:
    config_entry_id:
      name: Config Entry ID
      description: The configuration entry ID of the integration instance
      required: true
      example: "abc123def456"
      selector:
        text:

set_route:
  name: Set Route
  description: >
    Activate a route immediately. Geocodes the destination and any waypoints,
    calculates the route via the configured routing provider, and stores the
    active route in the coordinator. Corridor station search becomes active.
  fields:
    config_entry_id:
      name: Config Entry ID
      description: The configuration entry ID of the integration instance
      required: true
      example: "abc123def456"
      selector:
        text:
    destination:
      name: Destination
      description: Destination address or place name
      required: true
      example: "Berlin Hauptbahnhof"
      selector:
        text:
    origin:
      name: Origin
      description: Starting address or place name (uses current location if omitted)
      required: false
      example: "Hamburg Hauptbahnhof"
      selector:
        text:
    waypoints:
      name: Waypoints
      description: Optional list of intermediate stops
      required: false
      example: ["Hannover Hauptbahnhof"]
      selector:
        object:
    corridor_width_km:
      name: Corridor Width (km)
      description: Search radius in km on each side of the route for fuel stations
      required: false
      default: 5.0
      example: 5.0
      selector:
        number:
          min: 1
          max: 50
          step: 0.5
          unit_of_measurement: km
    routing_provider:
      name: Routing Provider
      description: Routing engine to use (osrm or google)
      required: false
      default: "osrm"
      example: "osrm"
      selector:
        select:
          options:
            - osrm
            - google
    google_api_key:
      name: Google API Key
      description: Google Directions API key (required when routing_provider is google)
      required: false
      example: "AIzaSy..."
      selector:
        text:
    departure_time:
      name: Departure Time
      description: Planned departure time in ISO 8601 format (e.g. 2026-06-01T08:00:00)
      required: false
      example: "2026-06-01T08:00:00"
      selector:
        text:

cancel_route:
  name: Cancel Route
  description: >
    Cancel the currently active route for the given integration instance.
