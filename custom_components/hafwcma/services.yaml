  name: Plan Route
  description: >
    Save a planned route without activating it. Geocodes the destination and
    waypoints, calculates the route distance and duration, then appends the
    route to the saved-routes list. The route remains in the list until
    explicitly activated via set_route or the Lovelace card.
  fields:
    config_entry_id:
      name: Config Entry ID
