add_trip:
  name: Add Trip
  description: Manually add a trip to the logbook
  fields:
    config_entry_id:
      name: Config Entry ID
      description: The configuration entry ID of the integration instance
      required: true
      example: "abc123def456"
      selector:
        text:
    timestamp_start:
      name: Trip Start
      description: Date and time when trip started (ISO format)
      required: true
      example: "2024-01-15T14:30:00"
      selector:
        datetime:
    timestamp_end:
      name: Trip End
      description: Date and time when trip ended (ISO format)
      required: true
      example: "2024-01-15T15:00:00"
      selector:
        datetime:
    distance_km:
      name: Distance
      description: Trip distance in kilometers
      required: true
      example: 25.5
      selector:
        number:
          min: 0
          max: 5000
          step: 0.1
          unit_of_measurement: "km"
    category:
      name: Category
      description: Trip category
      required: false
      default: "private"
      example: "business"
      selector:
        select:
          options:
            - "business"
            - "private"
            - "commute"
    purpose:
      name: Purpose
      description: Purpose or description of the trip
      required: false
      example: "Client meeting"
      selector:
        text:
    driver:
      name: Driver
      description: Name of the driver (required for GoBD compliance)
      required: false
      example: "Max Mustermann"
      selector:
        text:
    fuel_consumed:
      name: Fuel Consumed
      description: Fuel consumed during trip in liters
      required: false
      example: 2.5
      selector:
        number:
          min: 0
          max: 200
          step: 0.01
          unit_of_measurement: "L"
    additional_costs:
      name: Additional Costs
      description: Additional costs like tolls or parking in EUR
      required: false
      example: 5.50
      selector:
        number:
          min: 0
          max: 500
          step: 0.01
          unit_of_measurement: "€"
    odometer_start:
      name: Odometer Start
      description: Odometer reading at trip start in kilometers
      required: false
      example: 12345
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.1
          unit_of_measurement: "km"
    odometer_end:
      name: Odometer End
      description: Odometer reading at trip end in kilometers
      required: false
      example: 12370
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.1
          unit_of_measurement: "km"
    start_latitude:
      name: Start Latitude
      description: Latitude coordinate of trip start location
      required: false
      example: 50.0000
      selector:
        number:
          min: -90
          max: 90
          step: any
    start_longitude:
      name: Start Longitude
      description: Longitude coordinate of trip start location
      required: false
      example: 10.0000
      selector:
        number:
          min: -180
          max: 180
          step: any
    end_latitude:
      name: End Latitude
      description: Latitude coordinate of trip end location
      required: false
      example: 51.0000
      selector:
        number:
          min: -90
          max: 90
          step: any
    end_longitude:
      name: End Longitude
      description: Longitude coordinate of trip end location
      required: false
      example: 11.0000
      selector:
        number:
          min: -180
          max: 180
          step: any
    start_name:
      name: Start Location Name
      description: Name or description of the start location
      required: false
      example: "Home"
      selector:
        text:
    start_address:
      name: Start Address
      description: Address of the start location
      required: false
      example: "123 Main Street, City"
      selector:
        text:
    end_name:
      name: End Location Name
      description: Name or description of the end location
      required: false
      example: "Office"
      selector:
        text:
    end_address:
      name: End Address
      description: Address of the end location
      required: false
      example: "456 Business Ave, City"
      selector:
        text:

